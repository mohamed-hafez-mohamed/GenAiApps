# config.ini (unchanged from previous)
# Configuration File for RAG System

[llm]
provider = groq
temperature = 0.2
max_tokens = 1024
streaming = true

[llm.groq]
model = llama-3.1-8b-instant

[llm.openai]
model = gpt-4o-mini

[llm.anthropic]
model = claude-3-5-sonnet-20241022

[llm.ollama]
model = llama3.1
base_url = http://localhost:11434

[llm.huggingface]
model = mistralai/Mistral-7B-Instruct-v0.3

[embeddings]
provider = huggingface

[embeddings.huggingface]
model = all-MiniLM-L6-v2
device = cpu
batch_size = 64
normalize_embeddings = true

[embeddings.openai]
model = text-embedding-3-small

[embeddings.cohere]
model = embed-english-v3.0

[embeddings.ollama]
model = nomic-embed-text
base_url = http://localhost:11434

[vector_store]
provider = chroma
persist_directory = ./chroma_db
collection_name = rag_docs

[document_processing]
chunk_size = 600
chunk_overlap = 120
search_type = similarity
retrieval_k = 4

# ───────────────────────────────────────────────
# NEW: Custom branding / user image
# ───────────────────────────────────────────────
[ui]
user_image_url = https://example.com/my-avatar.png
# You can put any public image URL here
# or local path like: file:///home/user/avatar.jpg
# Leave empty or comment out to use default icon
page_title = AUTOSAR Q&A
page_icon = 📖