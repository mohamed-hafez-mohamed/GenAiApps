# Configuration File for RAG System
# Edit this file to switch between different providers and settings

# ════════════════════════════════════════════════════════════════════════════════
# LLM PROVIDER CONFIGURATION
# ════════════════════════════════════════════════════════════════════════════════

[llm]
# Available providers: groq, openai, anthropic, ollama, huggingface
provider = groq

# Provider-specific settings

# ── Groq Settings ──
[llm.groq]
model = llama-3.1-8b-instant
# Available models: 
#   - llama-3.1-8b-instant (fastest)
#   - llama-3.1-70b-versatile (most capable)
#   - mixtral-8x7b-32768 (large context)
#   - gemma2-9b-it (alternative)
temperature = 0.2
max_tokens = 1024
streaming = true

# ── OpenAI Settings ──
[llm.openai]
model = gpt-4-turbo-preview
# Available models:
#   - gpt-4-turbo-preview
#   - gpt-4
#   - gpt-3.5-turbo
#   - gpt-3.5-turbo-16k
temperature = 0.2
max_tokens = 1024
streaming = true

# ── Anthropic Settings ──
[llm.anthropic]
model = claude-3-5-sonnet-20241022
# Available models:
#   - claude-3-5-sonnet-20241022
#   - claude-3-opus-20240229
#   - claude-3-sonnet-20240229
#   - claude-3-haiku-20240307
temperature = 0.2
max_tokens = 1024
streaming = true

# ── Ollama Settings (Local) ──
[llm.ollama]
model = llama2
# Available models (must be installed locally):
#   - llama2
#   - mistral
#   - mixtral
#   - codellama
base_url = http://localhost:11434
temperature = 0.2
streaming = true

# ── HuggingFace Settings ──
[llm.huggingface]
model = meta-llama/Llama-2-7b-chat-hf
# Available models (requires access):
#   - meta-llama/Llama-2-7b-chat-hf
#   - mistralai/Mistral-7B-Instruct-v0.2
#   - google/flan-t5-xxl
temperature = 0.2
max_tokens = 1024

# ════════════════════════════════════════════════════════════════════════════════
# EMBEDDING PROVIDER CONFIGURATION
# ════════════════════════════════════════════════════════════════════════════════

[embeddings]
# Available providers: huggingface, openai, cohere, ollama
provider = huggingface

# ── HuggingFace Embeddings ──
[embeddings.huggingface]
model = all-MiniLM-L6-v2
# Available models:
#   - all-MiniLM-L6-v2 (fast, 384 dim)
#   - all-mpnet-base-v2 (quality, 768 dim)
#   - multi-qa-MiniLM-L6-cos-v1 (Q&A optimized)
#   - paraphrase-multilingual-MiniLM-L12-v2 (multilingual)
device = cpu
batch_size = 50
normalize_embeddings = true

# ── OpenAI Embeddings ──
[embeddings.openai]
model = text-embedding-3-small
# Available models:
#   - text-embedding-3-small (cheaper, 1536 dim)
#   - text-embedding-3-large (better quality, 3072 dim)
#   - text-embedding-ada-002 (legacy, 1536 dim)
dimensions = 1536

# ── Cohere Embeddings ──
[embeddings.cohere]
model = embed-english-v3.0
# Available models:
#   - embed-english-v3.0
#   - embed-multilingual-v3.0
#   - embed-english-light-v3.0
input_type = search_document

# ── Ollama Embeddings (Local) ──
[embeddings.ollama]
model = nomic-embed-text
# Available models (must be installed):
#   - nomic-embed-text
#   - mxbai-embed-large
base_url = http://localhost:11434

# ════════════════════════════════════════════════════════════════════════════════
# VECTOR STORE CONFIGURATION
# ════════════════════════════════════════════════════════════════════════════════

[vector_store]
# Available providers: chroma, faiss, pinecone, qdrant, weaviate
provider = chroma

# ── Chroma Settings (Local) ──
[vector_store.chroma]
persist_directory = ./chroma_db
collection_name = rag_documents

# ── FAISS Settings (Local) ──
[vector_store.faiss]
index_type = FlatL2
# Available types: FlatL2, FlatIP, IVFFlat, HNSW
save_directory = ./faiss_index

# ── Pinecone Settings (Cloud) ──
[vector_store.pinecone]
environment = us-west1-gcp
index_name = rag-index
dimension = 1536
metric = cosine

# ── Qdrant Settings (Cloud/Local) ──
[vector_store.qdrant]
url = http://localhost:6333
# For cloud: https://xyz.qdrant.io
collection_name = rag_documents
vector_size = 384

# ── Weaviate Settings (Cloud/Local) ──
[vector_store.weaviate]
url = http://localhost:8080
# For cloud: https://xyz.weaviate.network
index_name = RAGDocuments

# ════════════════════════════════════════════════════════════════════════════════
# DOCUMENT PROCESSING CONFIGURATION
# ════════════════════════════════════════════════════════════════════════════════

[document_processing]
# Text splitter settings
chunk_size = 600
chunk_overlap = 100
separators = ["\n\n", "\n", ". ", " ", ""]

# Retrieval settings
search_type = similarity
# Available types: similarity, mmr, similarity_score_threshold
retrieval_k = 5
# For MMR
fetch_k = 20
lambda_mult = 0.5
# For score threshold
score_threshold = 0.7

# ════════════════════════════════════════════════════════════════════════════════
# AGENT CONFIGURATION
# ════════════════════════════════════════════════════════════════════════════════

[agent]
# Agent settings
max_iterations = 3
verbose = true
return_intermediate_steps = true
handle_parsing_errors = true

# Agent tools to enable
enabled_tools = ["search_documents", "summarize_documents", "get_document_stats"]

# ════════════════════════════════════════════════════════════════════════════════
# UI CONFIGURATION
# ════════════════════════════════════════════════════════════════════════════════

[ui]
# Theme settings
theme = purple_gradient
# Available themes: purple_gradient, blue_ocean, green_forest, orange_sunset, custom

# Layout settings
page_title = Advanced RAG Agent System
page_icon = 🤖
layout = wide
sidebar_state = expanded

# Feature toggles
show_agent_reasoning = true
show_tool_usage = true
enable_animations = true
enable_chat_bubbles = true
enable_status_badges = true

# ════════════════════════════════════════════════════════════════════════════════
# ADVANCED SETTINGS
# ════════════════════════════════════════════════════════════════════════════════

[advanced]
# Enable LangSmith tracking
enable_langsmith = false
langsmith_project = RAG-Agent-System

# Performance settings
enable_caching = true
cache_ttl = 3600

# Session settings
session_timeout = 3600
max_history_messages = 50

# File upload settings
max_file_size_mb = 10
allowed_file_types = ["pdf"]
max_files_per_upload = 10

# ════════════════════════════════════════════════════════════════════════════════
# LOGGING CONFIGURATION
# ════════════════════════════════════════════════════════════════════════════════

[logging]
level = INFO
# Available levels: DEBUG, INFO, WARNING, ERROR, CRITICAL
format = "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
log_file = ./logs/rag_system.log
enable_file_logging = false
